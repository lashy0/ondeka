[alembic]
script_location = %(here)s

prepend_sys_path = %(here)s/../../..
path_separator = os

file_template = %%(year)d-%%(month).2d-%%(day).2d_%%(slug)s_%%(rev)s
timezone = UTC
truncate_slug_length = 40
output_encoding = utf-8

[post_write_hooks]
hooks = ruff_check, ruff_format

ruff_check.type = module
ruff_check.module = ruff
ruff_check.options = check --fix REVISION_SCRIPT_FILENAME

ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,alembic,sqlalchemy

[handlers]
keys = console

[formatters]
keys = console

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
level = NOTSET
formatter = console
args = (sys.stderr,)

[formatter_console]
format = %(asctime)s %(levelname)-7s [%(name)s] %(message)s
datefmt = %H:%M:%S
